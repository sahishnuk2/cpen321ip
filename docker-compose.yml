name: cpen321-project

services:
  backend:
    build: ./backend
    # Published on all interfaces so a physical Android device on the same Wi-Fi
    # can reach it. The emulator uses 10.0.2.2 to reach the host machine.
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - ./backend/.env
